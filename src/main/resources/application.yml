server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: auth-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway handles schema migrations; Hibernate validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Custom Application Security & JWT Configuration
app:
  jwt:
    # 256-bit secret key for HMAC-SHA256 signature (can be overridden via environment variable)
    secret: ${JWT_SECRET}
    # 15 minutes = 900,000 milliseconds
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    # 7 days = 604,800,000 milliseconds
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    # Cookie name for HttpOnly access token
    access-cookie-name: ecommerce_access_token
    # Cookie name for HttpOnly refresh token
    refresh-cookie-name: ecommerce_refresh_token
    cookie-secure: ${APP_COOKIE_SECURE:false}
    cookie-same-site: ${APP_COOKIE_SAME_SITE:Lax}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Springdoc OpenAPI (Swagger UI) Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
