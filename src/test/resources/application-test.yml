spring:
  datasource:
    url: jdbc:h2:mem:auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
app:
  jwt:
    secret: dGVzdC1zZWNyZXQtdmFsdWUtMzItYnl0ZXMtbG9uZw==
    access-token-expiration-ms: 60000
    access-cookie-name: ecommerce_access_token
    cookie-secure: false
    cookie-same-site: Lax
  cors:
    allowed-origins: http://localhost:5173
